[project]
name = "webring2"
version = "0.2.0"
description = "Because everything on the Web eventually loops back onto itself."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2.7",
    "django-admin-reset>=0.7.3",
    "django-auditlog>=3.3.0",
    "django-soft-delete>=1.0.21",
    "django-split-settings>=1.3.2",
    "jinja2>=3.1.6",
    "django-stubs>=5.2.6",
    "httpx>=0.28.1",
    "django-smart-ratelimit>=2.2.1",
    "django-cors-headers>=4.9.0",
]
[project.urls]
homepage = "https://github.com/le717/webring2"
source = "https://github.com/le717/webring2.git"
changelog = "https://github.com/le717/webring2/blob/main/CHANGES.md"

[dependency-groups]
dev = ["uv", "ruff"]

[tool.ruff]
indent-width = 4
line-length = 100

[tool.ruff.lint]
preview = true
extend-ignore = ["DJ008", "DJ012"]
extend-select = [
    "BLE", # flake8-blind-except
    "C4",  # flake8-comprehensions
    "DJ",  # django
    "I",   # isort
    "PTH", # flake8-use-pathlib
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TD",  # flake8-todos
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]

[tool.ruff.format]
preview = true
line-ending = "native"
indent-style = "space"
quote-style = "double"

[tool.ruff.lint.isort]
lines-after-imports = 2
